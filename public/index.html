<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realtime Interpreter</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel" aria-labelledby="app-title">
        <div class="heading-row">
          <div>
            <p class="eyebrow">OpenAI Realtime Interpreter</p>
            <h1 id="app-title">Simultan uebersetzen</h1>
          </div>
          <span id="status" class="status-pill" aria-live="polite">Bereit</span>
        </div>

        <div class="controls" aria-label="Interpreter controls">
          <label for="myLanguage">
            Meine Sprache
            <select id="myLanguage">
              <option value="de">Deutsch</option>
              <option value="en">Englisch</option>
              <option value="pl">Polnisch</option>
            </select>
          </label>

          <label for="partnerLanguage">
            Partnersprache
            <select id="partnerLanguage">
              <option value="en">Englisch</option>
              <option value="de">Deutsch</option>
              <option value="pl">Polnisch</option>
            </select>
          </label>
        </div>

        <div class="turn-controls" aria-label="Session controls">
          <button id="startButton" type="button">Start</button>
          <button id="stopButton" type="button" disabled>Stop</button>
        </div>

        <section class="translation-box" aria-labelledby="live-title">
          <div class="section-header">
            <h2 id="live-title">Live</h2>
            <button id="clearButton" class="secondary-button" type="button">Leeren</button>
          </div>
          <div class="live-grid">
            <article class="live-card">
              <h3>Gesprochen</h3>
              <p id="sourceText" class="live-text">Noch nichts erkannt.</p>
            </article>
            <article class="live-card">
              <h3>Dolmetscher</h3>
              <p id="translationText" class="live-text translated">Noch keine Uebersetzung.</p>
            </article>
          </div>
        </section>

        <audio id="remoteAudio" autoplay></audio>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
