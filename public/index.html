<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deutsch-Polnisch-Dolmetscher</title>
    <link rel="stylesheet" href="/styles.css?v=20260710-1555" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Deutsch ↔ Polnisch</h1>
        <p id="status" class="status" aria-live="polite">Bereit</p>
      </header>

      <section class="conversation" aria-label="Gesprächsverlauf">
        <div id="timeline" class="timeline" aria-live="polite"></div>
      </section>

      <section class="controls" aria-label="Gespräch steuern">
        <button id="startButton" class="primary" type="button">Gespräch starten</button>
        <button id="stopButton" class="danger" type="button" disabled>Gespräch beenden</button>
        <button id="clearButton" class="secondary" type="button" disabled>Verlauf löschen</button>
      </section>

      <p class="privacy">
        Die gesprochenen Inhalte werden zur Echtzeitverarbeitung an OpenAI übertragen.
        Audio wird von dieser Anwendung nicht dauerhaft gespeichert.
      </p>

      <audio id="remoteAudio" autoplay playsinline></audio>
    </main>

    <script src="/app.js?v=20260710-1555" type="module"></script>
  </body>
</html>
