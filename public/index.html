<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAI Dialogue Translator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel" aria-labelledby="app-title">
        <div class="heading-row">
          <div>
            <p class="eyebrow">OpenAI Dialogue Translator</p>
            <h1 id="app-title">Dialog uebersetzen und direkt hoeren</h1>
          </div>
          <span id="status" class="status-pill" aria-live="polite">Bereit</span>
        </div>

        <div class="controls" aria-label="Dialogue controls">
          <label for="myLanguage">
            Meine Sprache
            <select id="myLanguage">
              <option value="de">Deutsch</option>
              <option value="en">Englisch</option>
              <option value="pl">Polnisch</option>
            </select>
          </label>

          <label for="partnerLanguage">
            Partnersprache
            <select id="partnerLanguage">
              <option value="en">Englisch</option>
              <option value="de">Deutsch</option>
              <option value="pl">Polnisch</option>
            </select>
          </label>
        </div>

        <div class="turn-controls" aria-label="Recording controls">
          <button id="speakMineButton" type="button">Ich spreche</button>
          <button id="speakPartnerButton" type="button">Partner spricht</button>
          <button id="stopButton" type="button" disabled>Aufnahme stoppen</button>
        </div>

        <section class="translation-box" aria-labelledby="dialogue-title">
          <div class="section-header">
            <h2 id="dialogue-title">Dialog</h2>
            <button id="clearButton" class="secondary-button" type="button">Leeren</button>
          </div>
          <div id="dialogueLog" class="dialogue-log" aria-live="polite">
            <p class="empty-state">Noch kein Dialog.</p>
          </div>
        </section>

        <audio id="remoteAudio" autoplay></audio>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
